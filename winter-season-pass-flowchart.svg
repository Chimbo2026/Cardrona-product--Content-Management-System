<text class="nodeText" x="700" y="3387.95" text-anchor="middle" font-size="17"><tspan x="700" dy="0">检查订单金额并提交付款</tspan><tspan x="700" dy="26">实际付款需由购买者本人确认</tspan></text>
<rect class="done" x="430" y="3490" width="540" height="90" rx="14" filter="url(#soft)"/>
<text class="nodeText" x="700" y="3541.65" text-anchor="middle" font-size="19"><tspan x="700" dy="0">支付成功 / 订单确认</tspan></text>
<text class="small" x="700" y="3620" text-anchor="middle">核验范围：已查看到信用卡填写页；未输入卡片信息、未提交付款，支付成功页面未验证。</text>
<text class="small" x="700" y="3645" text-anchor="middle">Buy Now, Pay Later 的分期日期因购买月份变化；本次支付表单实际核验的是 Pay Now。</text>
<text class="small" x="700" y="3670" text-anchor="middle">夏季日票、MyCARD 与 waiver 流程来自登录后的测试订单；流程图重点展示 Winter Season Pass 购买路径。</text>
