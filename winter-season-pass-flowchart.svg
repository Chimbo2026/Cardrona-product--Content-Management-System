<text class="nodeText" x="700" y="441.3" text-anchor="middle" font-size="18"><tspan x="700" dy="0">选择付款方案</tspan></text>
<rect class="branch" x="150" y="535" width="450" height="100" rx="14" filter="url(#soft)"/>
<text class="nodeText" x="375" y="578.45" text-anchor="middle" font-size="17"><tspan x="375" dy="0">Pay Now</tspan><tspan x="375" dy="25">结账时一次支付</tspan></text>
<rect class="branch" x="800" y="535" width="450" height="100" rx="14" filter="url(#soft)"/>
<text class="nodeText" x="1025" y="567.6" text-anchor="middle" font-size="16"><tspan x="1025" dy="0">Buy Now, Pay Later</tspan><tspan x="1025" dy="23">先付 NZ$100；余款分期</tspan><tspan x="1025" dy="23">共 3–4 期，日期随购买月份变化</tspan></text>
