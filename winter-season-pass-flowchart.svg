<text class="nodeText" x="385" y="920.95" text-anchor="middle" font-size="17"><tspan x="385" dy="0">Winter Saver Season Pass</tspan><tspan x="385" dy="25">仅 Cardrona；2027/7/5–7/16 不可用</tspan><tspan x="385" dy="25">需勾选接受 Saver 规则</tspan></text>
<rect class="branch" x="755" y="870" width="520" height="140" rx="14" filter="url(#soft)"/>
<text class="nodeText" x="1015" y="920.95" text-anchor="middle" font-size="17"><tspan x="1015" dy="0">Winter Unlimited Season Pass</tspan><tspan x="1015" dy="25">Cardrona + Treble Cone</tspan><tspan x="1015" dy="25">Winter 2027 整季，无 blackout dates</tspan></text>
