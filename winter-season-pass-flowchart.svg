<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="3720" viewBox="0 0 1400 3720">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#697681"/></marker>
  <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#25313b" flood-opacity="0.12"/></filter>
  <style>
    .bg{fill:#f7f8fa}.title{font:700 32px 'PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#25313b}
    .sub{font:16px 'PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#64717c}
    .proc{fill:#edf7ef;stroke:#2f8b45;stroke-width:2.5}
    .decision{fill:#fff;stroke:#697681;stroke-width:2.5}
    .branch{fill:#fff;stroke:#8b989f;stroke-width:2}
    .note{fill:#fff8e6;stroke:#d7a93a;stroke-width:2}
    .done{fill:#eef3f7;stroke:#718492;stroke-width:2;stroke-dasharray:8 6}
    .edge{fill:none;stroke:#697681;stroke-width:2.3;marker-end:url(#arrow)}
    .label{font:600 15px 'PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#53616c}
    .nodeText{font:17px 'PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#25313b}
    .small{font:15px 'PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#53616c}
    .bold{font-weight:700}
  </style>
</defs>
