<text class="nodeText" x="700" y="231.3" text-anchor="middle" font-size="18"><tspan x="700" dy="0">打开 Winter 2027 Season Pass</tspan><tspan x="700" dy="27">整季通行证：不选单日或日期区间</tspan><tspan x="700" dy="27">此商品页没有 Gondola Ride 选项</tspan></text>
