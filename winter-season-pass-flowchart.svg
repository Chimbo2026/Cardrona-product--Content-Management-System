<text class="nodeText" x="385" y="1120.45" text-anchor="middle" font-size="17"><tspan x="385" dy="0">Saver 年龄类别</tspan><tspan x="385" dy="28">Adult 18–64｜Child 6–17</tspan><tspan x="385" dy="28">Senior 65–74</tspan></text>
