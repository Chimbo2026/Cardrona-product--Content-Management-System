<text class="nodeText" x="700" y="2954.95" text-anchor="middle" font-size="17"><tspan x="700" dy="0">核对或修改 Billing Address</tspan><tspan x="700" dy="26">必填：街道地址、国家、城市、地区 / 省州、邮编</tspan><tspan x="700" dy="26">地址第二行可选；页面已有地址时可修改</tspan></text>
<rect class="proc" x="350" y="3105" width="700" height="200" rx="14" filter="url(#soft)"/>
<text class="nodeText" x="700" y="3183.95" text-anchor="middle" font-size="17"><tspan x="700" dy="0">Payment Details（Windcave 信用卡）</tspan><tspan x="700" dy="27">卡号｜卡面姓名｜到期月 / 年｜CVC</tspan><tspan x="700" dy="27">点击 Continue 进入后续支付步骤</tspan></text>
