<text class="nodeText" x="700" y="2303.95" text-anchor="middle" font-size="17"><tspan x="700" dy="0">Assign Products：把每张年龄限制票分配给合适组员</tspan><tspan x="700" dy="27">若新增组员：名、姓、出生日期（日 / 月 / 年）</tspan><tspan x="700" dy="27">组员照片可能需要更新；系统按年龄限制分配</tspan></text>
